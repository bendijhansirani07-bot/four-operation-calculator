
<!DOCTYPE html>
<html>
<head>
    <title>Four Operation Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 4px 12px #0002;
        }

        h2 {
            color: #2457a7;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 65px;
            padding: 12px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #2457a7;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #163c78;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Four Operation Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number" step="any">
    <input type="number" id="num2" placeholder="Enter second number" step="any">

    <div>
        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">−</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>
    </div>

    <div id="result">Result will appear here</div>
</div>

<script>
    function calculate(operator) {
        let a = document.getElementById("num1").value;
        let b = document.getElementById("num2").value;
        let result;

        if (a === "" || b === "") {
            document.getElementById("result").innerHTML =
                "Please enter both numbers";
            return;
        }

        a = Number(a);
        b = Number(b);

        if (operator === '+') {
            result = a + b;
        }
        else if (operator === '-') {
            result = a - b;
        }
        else if (operator === '*') {
            result = a * b;
        }
        else if (operator === '/') {
            if (b === 0) {
                document.getElementById("result").innerHTML =
                    "Cannot divide by zero";
                return;
            }
            result = a / b;
        }

        document.getElementById("result").innerHTML =
            "Result: " + result;
    }
</script>

</body>
</html>
